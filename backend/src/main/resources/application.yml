spring:
  application:
    name: bola-de-cristal
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/boladecristal}
    username: ${DB_USER:boladecristal}
    password: ${DB_PASSWORD:boladecristal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  web:
    error:
      include-message: always

server:
  port: ${PORT:8081}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 30d
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
  users:
    - username: nico
      display-name: Nico
      password: ${NICO_PASSWORD}
      color: "#7E57C2"
    - username: lola
      display-name: Lola
      password: ${LOLA_PASSWORD}
      color: "#FF8F00"