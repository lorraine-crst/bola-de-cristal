services:
  mysql:
    image: mysql:8.4
    container_name: boladecristal-mysql
    environment:
      MYSQL_DATABASE: boladecristal
      MYSQL_USER: boladecristal
      MYSQL_PASSWORD: boladecristal
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: